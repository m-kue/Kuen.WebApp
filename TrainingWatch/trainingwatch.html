<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.webmanifest">
<title>TrainingWatch</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1a1a2e;
    transition: background 1s ease;
  }

  body.abgelaufen {
    background: #c0392b;
  }

  #anzeige {
    font-size: min(38vw, 45vh);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #ffffff;
    letter-spacing: -0.02em;
    user-select: none;
    line-height: 1;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }

  #steuerung {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  #vollbildKnopf {
    font-size: 1.2rem;
    font-weight: 600;
    padding: 12px 28px;
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 999px;
    background: transparent;
    color: #ffffff;
    cursor: pointer;
  }

  #vollbildKnopf:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  #startKnopf {
    font-size: 1.2rem;
    font-weight: 600;
    padding: 12px 36px;
    border: none;
    border-radius: 999px;
    background: #16a085;
    color: #ffffff;
    cursor: pointer;
  }

  #startKnopf:hover {
    background: #1abc9c;
  }

  #resetKnopf {
    font-size: 1.2rem;
    font-weight: 600;
    padding: 12px 28px;
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 999px;
    background: transparent;
    color: #ffffff;
    cursor: pointer;
  }

  #resetKnopf:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  .grenze {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #ffffff;
    font-size: 1rem;
  }

  .grenze input {
    width: 4.5em;
    font-size: 1rem;
    padding: 8px;
    border: none;
    border-radius: 8px;
    text-align: center;
    background: rgba(255, 255, 255, 0.15);
    color: #ffffff;
  }

  .grenze input:focus {
    outline: 2px solid #16a085;
  }
</style>
</head>
<body>
  <div id="anzeige">00:00</div>

  <div id="steuerung">
    <button id="startKnopf">Start</button>
    <button id="resetKnopf">Reset</button>
    <button id="vollbildKnopf">Vollbild</button>
    <label class="grenze">
      Farbwechsel ab
      <input id="grenzeMin" type="number" min="0" max="999" value="3"> Min
      <input id="grenzeSek" type="number" min="0" max="59" value="0"> Sek
    </label>
  </div>

<script>
  const anzeige = document.getElementById('anzeige');
  const knopf = document.getElementById('startKnopf');
  const resetKnopf = document.getElementById('resetKnopf');
  const vollbildKnopf = document.getElementById('vollbildKnopf');
  const grenzeMin = document.getElementById('grenzeMin');
  const grenzeSek = document.getElementById('grenzeSek');

  let laufend = false;
  let basisSekunden = 0;
  let startZeit = 0;

  function pad(n) {
    return String(n).padStart(2, '0');
  }

  function grenzeSekunden() {
    const min = Math.max(0, parseInt(grenzeMin.value, 10) || 0);
    const sek = Math.min(59, Math.max(0, parseInt(grenzeSek.value, 10) || 0));
    return min * 60 + sek;
  }

  function zeige(sekunden) {
    anzeige.textContent = pad(Math.floor(sekunden / 60)) + ':' + pad(sekunden % 60);
    document.body.classList.toggle('abgelaufen', sekunden >= grenzeSekunden());
  }

  function aktualisieren() {
    if (!laufend) return;
    zeige(basisSekunden + Math.floor((Date.now() - startZeit) / 1000));
    requestAnimationFrame(aktualisieren);
  }

  knopf.addEventListener('click', () => {
    if (laufend) {
      basisSekunden += Math.floor((Date.now() - startZeit) / 1000);
      laufend = false;
      knopf.textContent = 'Weiter';
    } else {
      startZeit = Date.now();
      laufend = true;
      knopf.textContent = 'Pause';
      aktualisieren();
    }
  });

  resetKnopf.addEventListener('click', () => {
    laufend = false;
    basisSekunden = 0;
    knopf.textContent = 'Start';
    zeige(0);
  });

  function grenzeGeaendert() {
    zeige(basisSekunden);
  }

  grenzeMin.addEventListener('input', grenzeGeaendert);
  grenzeSek.addEventListener('input', grenzeGeaendert);

  vollbildKnopf.addEventListener('click', () => {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      document.documentElement.requestFullscreen();
    }
  });

  document.addEventListener('fullscreenchange', () => {
    vollbildKnopf.textContent = document.fullscreenElement ? 'Vollbild beenden' : 'Vollbild';
  });

  let wakeLock = null;

  async function bildschirmWachHalten() {
    if (!('wakeLock' in navigator) || document.visibilityState !== 'visible' || wakeLock) {
      return;
    }
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => {
        wakeLock = null;
      });
    } catch (err) {
      wakeLock = null;
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      bildschirmWachHalten();
    }
  });

  document.addEventListener('pointerdown', bildschirmWachHalten);

  bildschirmWachHalten();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
