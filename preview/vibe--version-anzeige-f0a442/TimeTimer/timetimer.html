<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.webmanifest">
<script src="../shared/version.js" defer></script>
<title>TimeTimer</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1a1a2e;
    transition: background 1s ease;
  }

  body.abgelaufen {
    background: #c0392b;
  }

  #scheibe {
    width: min(88vw, 58vh);
    height: min(88vw, 58vh);
    flex: none;
  }

  #anzeige {
    font-variant-numeric: tabular-nums;
    user-select: none;
  }

  #steuerung {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  #startKnopf {
    font-size: 0.95rem;
    font-weight: 600;
    padding: 8px 26px;
    border: none;
    border-radius: 999px;
    background: #16a085;
    color: #ffffff;
    cursor: pointer;
  }

  #startKnopf:hover {
    background: #1abc9c;
  }

  #resetKnopf {
    font-size: 0.95rem;
    font-weight: 600;
    padding: 8px 20px;
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 999px;
    background: transparent;
    color: #ffffff;
    cursor: pointer;
  }

  #resetKnopf:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  #vollbildKnopf {
    font-size: 0.95rem;
    font-weight: 600;
    padding: 8px 20px;
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 999px;
    background: transparent;
    color: #ffffff;
    cursor: pointer;
  }

  #vollbildKnopf:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  .vorgabe {
    font-size: 0.85rem;
    font-weight: 600;
    padding: 6px 12px;
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 999px;
    background: transparent;
    color: #ffffff;
    cursor: pointer;
  }

  .vorgabe:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  .zeit {
    display: flex;
    align-items: center;
    gap: 4px;
    color: #ffffff;
    font-size: 0.85rem;
  }

  .zeit input {
    width: 3.2em;
    font-size: 0.85rem;
    padding: 5px;
    border: none;
    border-radius: 8px;
    text-align: center;
    background: rgba(255, 255, 255, 0.15);
    color: #ffffff;
  }

  .zeit input:focus {
    outline: 2px solid #16a085;
  }

  .zeit input:disabled,
  .vorgabe:disabled {
    opacity: 0.45;
  }

  .signalton {
    display: flex;
    align-items: center;
    gap: 4px;
    color: #ffffff;
    font-size: 0.85rem;
    user-select: none;
  }
</style>
</head>
<body>
  <svg id="scheibe" viewBox="0 0 200 200" role="img" aria-label="Verbleibende Zeit als rote Scheibe">
    <circle cx="100" cy="100" r="97" fill="#12122a" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2"></circle>
    <path id="rot" fill="#e74c3c" d=""></path>
    <g id="skala"></g>
    <text id="anzeige" x="100" y="100" text-anchor="middle" dominant-baseline="central" font-size="30" font-weight="700" fill="#ffffff">60:00</text>
  </svg>

  <div id="steuerung">
    <button id="startKnopf">Start</button>
    <button id="resetKnopf">Reset</button>
    <button id="vollbildKnopf">Vollbild</button>
    <span id="vorgaben">
      <button class="vorgabe" data-min="5">5</button>
      <button class="vorgabe" data-min="10">10</button>
      <button class="vorgabe" data-min="15">15</button>
      <button class="vorgabe" data-min="25">25</button>
      <button class="vorgabe" data-min="30">30</button>
      <button class="vorgabe" data-min="45">45</button>
      <button class="vorgabe" data-min="60">60</button>
    </span>
    <label class="zeit">
      Zeit
      <input id="zeitMin" type="number" min="0" max="60" value="25"> Min
      <input id="zeitSek" type="number" min="0" max="59" value="0"> Sek
    </label>
    <label class="signalton">
      <input id="signalton" type="checkbox" checked>
      Signalton
    </label>
  </div>

<script>
  const skala = document.getElementById('skala');
  const rot = document.getElementById('rot');
  const anzeige = document.getElementById('anzeige');
  const knopf = document.getElementById('startKnopf');
  const resetKnopf = document.getElementById('resetKnopf');
  const vollbildKnopf = document.getElementById('vollbildKnopf');
  const zeitMin = document.getElementById('zeitMin');
  const zeitSek = document.getElementById('zeitSek');
  const signalton = document.getElementById('signalton');
  const vorgaben = document.querySelectorAll('.vorgabe');

  const NS = 'http://www.w3.org/2000/svg';
  const MITTE = 100;
  const R_ROT = 68;
  const R_SKALA = 74;
  const R_ZEICHEN = 90;
  const MAX_SEKUNDEN = 3600;

  let laufend = false;
  let basisRest = 0;
  let startZeit = 0;

  function punkt(winkelGrad, radius) {
    const rad = winkelGrad * Math.PI / 180;
    return {
      x: MITTE + radius * Math.sin(rad),
      y: MITTE - radius * Math.cos(rad)
    };
  }

  function skalaAufbauen() {
    for (let i = 0; i < 60; i++) {
      const gross = i % 5 === 0;
      const a = punkt(i * 6, R_ZEICHEN);
      const b = punkt(i * 6, gross ? R_ZEICHEN - 7 : R_ZEICHEN - 3);
      const linie = document.createElementNS(NS, 'line');
      linie.setAttribute('x1', a.x);
      linie.setAttribute('y1', a.y);
      linie.setAttribute('x2', b.x);
      linie.setAttribute('y2', b.y);
      linie.setAttribute('stroke', gross ? 'rgba(255, 255, 255, 0.7)' : 'rgba(255, 255, 255, 0.3)');
      linie.setAttribute('stroke-width', gross ? '2' : '1');
      skala.appendChild(linie);
    }
    for (let m = 0; m < 60; m += 5) {
      const p = punkt(m * 6, R_SKALA);
      const zahl = document.createElementNS(NS, 'text');
      zahl.setAttribute('x', p.x);
      zahl.setAttribute('y', p.y);
      zahl.setAttribute('text-anchor', 'middle');
      zahl.setAttribute('dominant-baseline', 'central');
      zahl.setAttribute('font-size', '11');
      zahl.setAttribute('fill', 'rgba(255, 255, 255, 0.85)');
      zahl.textContent = String(m);
      skala.appendChild(zahl);
    }
  }

  function bogenPfad(anteil) {
    if (anteil <= 0) {
      return '';
    }
    const oben = { x: MITTE, y: MITTE - R_ROT };
    if (anteil >= 1) {
      const unten = { x: MITTE, y: MITTE + R_ROT };
      return 'M ' + MITTE + ' ' + MITTE +
        ' L ' + oben.x + ' ' + oben.y +
        ' A ' + R_ROT + ' ' + R_ROT + ' 0 1 1 ' + unten.x + ' ' + unten.y +
        ' A ' + R_ROT + ' ' + R_ROT + ' 0 1 1 ' + oben.x + ' ' + oben.y + ' Z';
    }
    const winkel = anteil * 360;
    const ende = punkt(winkel, R_ROT);
    const gross = winkel > 180 ? 1 : 0;
    return 'M ' + MITTE + ' ' + MITTE +
      ' L ' + oben.x + ' ' + oben.y +
      ' A ' + R_ROT + ' ' + R_ROT + ' 0 ' + gross + ' 1 ' + ende.x + ' ' + ende.y + ' Z';
  }

  function pad(n) {
    return String(n).padStart(2, '0');
  }

  function gesamtSekunden() {
    const min = Math.min(60, Math.max(0, parseInt(zeitMin.value, 10) || 0));
    const sek = Math.min(59, Math.max(0, parseInt(zeitSek.value, 10) || 0));
    return min * 60 + sek;
  }

  function zeige(restSek) {
    const anteil = Math.min(1, Math.max(0, restSek / MAX_SEKUNDEN));
    rot.setAttribute('d', bogenPfad(anteil));
    const sek = Math.ceil(restSek);
    const text = pad(Math.floor(sek / 60)) + ':' + pad(sek % 60);
    if (text !== anzeige.textContent) {
      anzeige.textContent = text;
    }
    document.body.classList.toggle('abgelaufen', restSek <= 0 && gesamtSekunden() > 0);
  }

  function restSekunden() {
    if (!laufend) {
      return basisRest;
    }
    return Math.max(0, basisRest - (Date.now() - startZeit) / 1000);
  }

  function sperreZeitInputs() {
    zeitMin.disabled = laufend;
    zeitSek.disabled = laufend;
    vorgaben.forEach((b) => { b.disabled = laufend; });
  }

  function aktualisieren() {
    if (!laufend) return;
    const rest = restSekunden();
    zeige(rest);
    if (rest <= 0) {
      laufend = false;
      knopf.textContent = 'Start';
      sperreZeitInputs();
      signal();
    } else {
      requestAnimationFrame(aktualisieren);
    }
  }

  knopf.addEventListener('click', () => {
    if (laufend) {
      basisRest = restSekunden();
      laufend = false;
      knopf.textContent = 'Weiter';
      zeige(basisRest);
    } else {
      if (gesamtSekunden() <= 0) {
        zeige(0);
        return;
      }
      if (basisRest <= 0) {
        basisRest = gesamtSekunden();
      }
      startZeit = Date.now();
      laufend = true;
      knopf.textContent = 'Pause';
      sperreZeitInputs();
      aktualisieren();
    }
    sperreZeitInputs();
  });

  resetKnopf.addEventListener('click', () => {
    laufend = false;
    basisRest = gesamtSekunden();
    knopf.textContent = 'Start';
    sperreZeitInputs();
    zeige(basisRest);
  });

  function zeitGeaendert() {
    if (laufend) return;
    basisRest = gesamtSekunden();
    zeige(basisRest);
  }

  zeitMin.addEventListener('input', zeitGeaendert);
  zeitSek.addEventListener('input', zeitGeaendert);

  vorgaben.forEach((b) => {
    b.addEventListener('click', () => {
      zeitMin.value = b.dataset.min;
      zeitSek.value = 0;
      zeitGeaendert();
    });
  });

  let audioKontext = null;

  function signal() {
    if (!signalton.checked) return;
    if (navigator.vibrate) {
      navigator.vibrate([200, 100, 200]);
    }
    try {
      audioKontext = audioKontext || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = audioKontext.currentTime;
      for (let i = 0; i < 3; i++) {
        const osc = audioKontext.createOscillator();
        const gain = audioKontext.createGain();
        osc.type = 'square';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.15, t0 + i * 0.4);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + i * 0.4 + 0.25);
        osc.connect(gain).connect(audioKontext.destination);
        osc.start(t0 + i * 0.4);
        osc.stop(t0 + i * 0.4 + 0.3);
      }
    } catch (err) {
      audioKontext = null;
    }
  }

  vollbildKnopf.addEventListener('click', () => {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      document.documentElement.requestFullscreen();
    }
  });

  let wakeLock = null;

  async function bildschirmWachHalten() {
    if (!('wakeLock' in navigator) || document.visibilityState !== 'visible' || wakeLock) {
      return;
    }
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => {
        wakeLock = null;
      });
    } catch (err) {
      wakeLock = null;
    }
  }

  function wakeLockFreigeben() {
    if (wakeLock) {
      wakeLock.release().catch(() => {});
    }
  }

  document.addEventListener('fullscreenchange', () => {
    vollbildKnopf.textContent = document.fullscreenElement ? 'Vollbild beenden' : 'Vollbild';
    if (document.fullscreenElement) {
      bildschirmWachHalten();
    } else {
      wakeLockFreigeben();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && document.fullscreenElement) {
      bildschirmWachHalten();
    }
  });

  skalaAufbauen();
  zeitGeaendert();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then((registrierung) => {
      registrierung.update();
    });
  }
</script>
</body>
</html>
